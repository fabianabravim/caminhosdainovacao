name: Deploy Caminhos da Inovacao

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build -- --base=/caminhosdainovacao/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verificar build
        run: |
          echo "========================================="
          echo "DIRETORIO ATUAL"
          echo "========================================="
          pwd

          echo ""
          echo "========================================="
          echo "ARQUIVOS DA RAIZ"
          echo "========================================="
          ls -la

          echo ""
          echo "========================================="
          echo "CONTEUDO DE .output"
          echo "========================================="
          if [ -d ".output" ]; then
            find .output -maxdepth 4 -type f | head -100
          else
            echo "A pasta .output nao existe."
          fi

          echo ""
          echo "========================================="
          echo "PASTAS DENTRO DE .output"
          echo "========================================="
          if [ -d ".output" ]; then
            find .output -maxdepth 3 -type d
          fi

      - name: Verificar pasta publica
        run: |
          echo "Procurando possiveis diretorios de publicacao..."

          if [ -d ".output/public" ]; then
            echo "ENCONTRADO: .output/public"
            ls -la .output/public
          fi

          if [ -d "dist" ]; then
            echo "ENCONTRADO: dist"
            ls -la dist
          fi

          if [ -d "build" ]; then
            echo "ENCONTRADO: build"
            ls -la build
          fi
